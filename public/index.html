<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boris Quiroa - Reto Maestro-Detalle</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 2rem;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: #94a3b8; margin-bottom: 2rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 1.25rem;
    border: 1px solid #334155;
  }
  .card h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
  .card .correo { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1rem; }
  .progress-bar {
    background: #334155;
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 0.75rem;
  }
  .progress-fill {
    background: #22c55e;
    height: 100%;
  }
  .stats { display: flex; justify-content: space-between; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.75rem; }
  ul.misiones { list-style: none; padding: 0; margin: 0; }
  ul.misiones li {
    display: flex;
    justify-content: space-between;
    padding: 0.35rem 0;
    border-bottom: 1px solid #334155;
    font-size: 0.9rem;
  }
  ul.misiones li:last-child { border-bottom: none; }
  .badge {
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge.completa { background: #14532d; color: #86efac; }
  .badge.pendiente { background: #451a03; color: #fdba74; }
  .empty { color: #94a3b8; text-align: center; padding: 3rem; }
  #status { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1rem; }
</style>
</head>
<body>
  <h1>🎯 Tablero de Avance</h1>
<p class="subtitle">Reto: API Maestro-Detalle con Catálogo y Control de Estado</p>
<p class="subtitle" style="color:#e2e8f0; font-weight:600;">
  Boris Alexander Quiroa Orellana · Carnet 1890-22-1413
</p>
  <div class="grid" id="grid"></div>

  <script>
    async function cargarEstudiantes() {
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");
      try {
        const resp = await fetch("/api/estudiantes");
        const json = await resp.json();

        if (!json.ok) {
          status.textContent = "Error: " + json.error;
          return;
        }

        const estudiantes = json.data;
        if (estudiantes.length === 0) {
          status.textContent = "";
          grid.innerHTML = '<p class="empty">Todavía no hay estudiantes registrados. Envía un POST a /api/registro para empezar.</p>';
          return;
        }

        status.textContent = `${estudiantes.length} estudiante(s) registrado(s).`;
        grid.innerHTML = estudiantes.map(renderCard).join("");
      } catch (err) {
        status.textContent = "No se pudo conectar con la API: " + err.message;
      }
    }

    function renderCard(est) {
      const total = est.completadas + est.pendientes;
      const pct = total > 0 ? Math.round((est.completadas / total) * 100) : 0;

      const misionesHtml = est.misiones
        .map(
          (m) => `
        <li>
          <span>${m.nombre}</span>
          <span class="badge ${m.estado ? "completa" : "pendiente"}">
            ${m.estado ? "Completada" : "Pendiente"}
          </span>
        </li>`
        )
        .join("");

      return `
        <div class="card">
          <h2>${est.nombre}</h2>
          <div class="correo">${est.carnet} · ${est.correo}</div>
          <div class="stats">
            <span>${est.completadas}/${total} misiones</span>
            <span>${pct}%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
          <ul class="misiones">${misionesHtml || "<li>Sin misiones registradas</li>"}</ul>
        </div>
      `;
    }

    cargarEstudiantes();
    // Refresca cada 5 segundos por si se hacen POSTs desde Postman/Insomnia
    setInterval(cargarEstudiantes, 5000);
  </script>
</body>
</html>
